<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Courier New', monospace;
    flex-direction: column;
    gap: 20px;
  }
  .game-wrapper {
    background: #16213e;
    padding: 30px; border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,255,136,0.15);
  }
  canvas {
    display: block; margin: 0 auto;
    background: #0f3460;
    border-radius: 8px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
  }
  .info-panel {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 500px; margin: 0 auto;
  }
  .score-box {
    color: #e0e0e0; font-size: 1.3rem; font-weight: bold;
    background: #16213e; padding: 10px 24px; border-radius: 8px;
    border: 1px solid #0f3460;
  }
  .score-box span { color: #00ff88; }
  button {
    background: #00ff88; color: #1a1a2e; border: none;
    padding: 10px 28px; font-size: 1.1rem; font-weight: bold;
    border-radius: 8px; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  button:hover { background: #00cc6a; transform: scale(1.05); }
  .game-over {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 30px 50px;
    border-radius: 12px; text-align: center; display: none;
  }
  .game-over h2 { color: #ff4444; margin-bottom: 10px; font-size: 2rem; }
  .game-over p { color: #ccc; margin-bottom: 20px; font-size: 1.1rem; }
  .canvas-wrapper { position: relative; }
  .controls-hint {
    color: #555; font-size: 0.85rem; text-align: center; margin-top: 8px;
  }
  @media (max-width: 520px) {
    .game-wrapper { padding: 15px; }
    canvas { width: 100%; height: auto; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="info-panel">
    <div class="score-box">Score: <span id="score">0</span></div>
    <button id="restartBtn">Restart</button>
  </div>
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="game-over" id="gameOver">
      <h2>Game Over</h2>
      <p>Score: <span id="finalScore">0</span></p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>
  <div class="controls-hint">Arrow keys / WASD to move &bull; Space to restart</div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('finalScore');
  const gameOverEl = document.getElementById('gameOver');

  const GRID_SIZE = 20;       // 20x20 grid
  const CELL_SIZE = 25;       // 500 / 20

  let snake, direction, nextDirection, food, score, gameLoop, running;

  function init() {
    snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10},
    ];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = 0;
    running = true;
    gameOverEl.style.display = 'none';
    scoreEl.textContent = '0';
    spawnFood();
    draw();
  }

  function spawnFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(canvas.width, i * CELL_SIZE);
      ctx.stroke();
    }

    // Draw snake
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      const pad = isHead ? 1 : 2;
      const radius = 4;

      ctx.fillStyle = isHead ? '#00ff88' : '#00cc6a';
      ctx.shadowColor = isHead ? '#00ff88' : 'transparent';
      ctx.shadowBlur = isHead ? 12 : 0;

      ctx.beginPath();
      ctx.roundRect(
        seg.x * CELL_SIZE + pad,
        seg.y * CELL_SIZE + pad,
        CELL_SIZE - pad * 2,
        CELL_SIZE - pad * 2,
        radius
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes on head
      if (isHead) {
        ctx.fillStyle = '#1a1a2e';
        const eyeSize = 3;
        let ex1, ey1, ex2, ey2;
        if (direction.x === 1) {
          ex1 = seg.x * CELL_SIZE + 16; ey1 = seg.y * CELL_SIZE + 6;
          ex2 = seg.x * CELL_SIZE + 16; ey2 = seg.y * CELL_SIZE + 16;
        } else if (direction.x === -1) {
          ex1 = seg.x * CELL_SIZE + 7; ey1 = seg.y * CELL_SIZE + 6;
          ex2 = seg.x * CELL_SIZE + 7; ey2 = seg.y * CELL_SIZE + 16;
        } else if (direction.y === -1) {
          ex1 = seg.x * CELL_SIZE + 6; ey1 = seg.y * CELL_SIZE + 7;
          ex2 = seg.x * CELL_SIZE + 16; ey2 = seg.y * CELL_SIZE + 7;
        } else {
          ex1 = seg.x * CELL_SIZE + 6; ey1 = seg.y * CELL_SIZE + 16;
          ex2 = seg.x * CELL_SIZE + 16; ey2 = seg.y * CELL_SIZE + 16;
        }
        ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Draw food
    ctx.fillStyle = '#ff4757';
    ctx.shadowColor = '#ff4757';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(
      food.x * CELL_SIZE + CELL_SIZE / 2,
      food.y * CELL_SIZE + CELL_SIZE / 2,
      CELL_SIZE / 2 - 3, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function update() {
    if (!running) return;

    direction = {...nextDirection};
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    // Wall collision
    if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
      gameOver();
      return;
    }

    // A move into the current tail is legal when the tail moves away this tick.
    const willEat = head.x === food.x && head.y === food.y;
    const occupiedBody = willEat ? snake : snake.slice(0, -1);
    if (occupiedBody.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    // Eat food
    if (willEat) {
      score++;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    finalScoreEl.textContent = score;
    gameOverEl.style.display = 'block';
    clearInterval(gameLoop);
    gameLoop = null;
  }

  function startLoop() {
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(update, 120);
  }

  function restart() {
    if (gameLoop) clearInterval(gameLoop);
    init();
    startLoop();
  }

  // Input handling
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    const prevent = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','W','a','A','s','S','d','D']);
    if (prevent.has(key)) e.preventDefault();

    if (key === ' ' || key === 'Space') { restart(); return; }

    if (!running) return;

    // Arrow keys
    if (key === 'ArrowUp' || key === 'w' || key === 'W') {
      if (direction.y !== 1) nextDirection = {x: 0, y: -1};
    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
      if (direction.y !== -1) nextDirection = {x: 0, y: 1};
    } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
      if (direction.x !== 1) nextDirection = {x: -1, y: 0};
    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
      if (direction.x !== -1) nextDirection = {x: 1, y: 0};
    }
  });

  // Touch / swipe support for mobile
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart || !running || !e.changedTouches[0]) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && direction.x !== -1) nextDirection = {x: 1, y: 0};
      else if (dx < 0 && direction.x !== 1) nextDirection = {x: -1, y: 0};
    } else {
      if (dy > 0 && direction.y !== -1) nextDirection = {x: 0, y: 1};
      else if (dy < 0 && direction.y !== 1) nextDirection = {x: 0, y: -1};
    }
    touchStart = null;
  }, {passive: true});

  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('playAgainBtn').addEventListener('click', restart);

  // roundRect polyfill for older browsers
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (r > w/2) r = w/2;
      if (r > h/2) r = h/2;
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      return this;
    };
  }

  init();
  startLoop();
</script>
</body>
</html>
